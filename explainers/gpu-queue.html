.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));

}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));

    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });

    const floorGpu = { x: BX0 - 2, y: 17, w: GATE - BX0 + 2, d: 17, r: 1 };
    const floorRam = { x: GATE, y: 17, w: RAM_END - GATE + 2, d: 17, r: 1 };
    add({ name: "bay.floor", box: boxOf({ x: BX0 - 2, y: 17, w: RAM_END - BX0 + 4, d: 17 }, 0, FLOOR), svg:
      S(k.slabOf(floorGpu, 0, FLOOR, P, 3, 0.6), { tone: "mid" }) + S(k.slabOf(floorRam, 0, FLOOR, P, 3, 0.6), { tone: "lo" }) +
      Ln(k.planOutline({ x: BX0 + 0.6, y: BAY_Y[0] + 0.6, w: GATE - BX0 - 1.2, d: BAY_Y[1] - BAY_Y[0] - 1.2, r: 0.6 }, FLOOR, P, 2), { tone: "faint" }),
      shape: [{ t: "slab", plan: floorGpu, z: 0, h: FLOOR }, { t: "slab", plan: floorRam, z: 0, h: FLOOR }] });
    const back = { x: BX0 - 2, y: 17, w: RAM_END - BX0 + 4, d: 2.4, r: 0.6 };
    add({ name: "bay.back", box: boxOf(back, FLOOR, 12), svg: S(k.slabOf(back, FLOOR, 12 - FLOOR, P, 2, 0.4), { tone: "mid" }), shape: [{ t: "slab", plan: back, z: FLOOR, h: 12 - FLOOR }] });
    for (const [name, x] of [["bay.endL", BX0 - 2], ["bay.endR", RAM_END]]) {
      const plan = { x, y: 19.4, w: 2, d: 11.2, r: 0.5 };
      add({ name, box: boxOf(plan, FLOOR, 9), svg: S(k.slabOf(plan, FLOOR, 9 - FLOOR, P, 2, 0.3), { tone: "mid" }), shape: [{ t: "slab", plan, z: FLOOR, h: 9 - FLOOR }] });
    }
    // the front lip carries the ruler: a tick every half GB, a long one every GB
    const lip = { x: BX0 - 2, y: 30.6, w: RAM_END - BX0 + 4, d: 3.4, r: 0.6 };
    const ticks = k.topTicks(BX0, RAM_END, U / 2, 2, 30.7, 7, [1, 1.9], P);
    const svg = S(k.slabOf(lip, FLOOR, 7 - FLOOR, P, 2, 0.3), { tone: "mid" }) + Ln(ticks.minor, { tone: "lo" }) + Ln(ticks.major, { tone: "hi" });
    const words = k.faceTextSvg(k.sideMatrix([BX0 + 30, lip.y + lip.d], 6.4, P, "left"), "GPU \u00b7 16 GB", { size: 2.1, tone: "hi" }) +
      k.faceTextSvg(k.sideMatrix([GATE + 2, lip.y + lip.d], 6.4, P, "left"), "SYSTEM RAM", { size: 2.1, tone: "mid" });
    add({ name: "bay.lip", box: boxOf(lip, FLOOR, 7), svg: svg + words, shape: [{ t: "slab", plan: lip, z: FLOOR, h: 7 - FLOOR }] });
    // the reserve ComfyUI keeps free, bolted to the left end
    const res = { x: BX0, y: BAY_Y[0], w: M.RESERVE_GB * U, d: BAY_Y[1] - BAY_Y[0], r: 0.5 };
    add({ name: "reserve", box: boxOf(res, FLOOR, FLOOR + 8), svg:
      S(k.slabOf(res, FLOOR, 8, P, 2, 0.4), { tone: "lo", inner: Ln(k.sideSeam(res, FLOOR + 4, P, 2), { tone: "faint" }) }) +
      Dt([at([res.x + res.w / 2, res.y + 3, FLOOR + 8]), at([res.x + res.w / 2, res.y + res.d - 3, FLOOR + 8])], { size: 0.45 }),
      shape: [{ t: "slab", plan: res, z: FLOOR, h: 8 }] });
    // gate posts at 16 GB
    for (const y of [15, 36]) {
      add({ name: `gate${y}`, box: [[GATE - 1.8, y - 1.8, 0], [GATE + 1.8, y + 1.8, 24]], svg:
        S(k.cylinder(GATE, y, 1.8, 0, 1.2, P, 20), { tone: "lo" }) + S(k.cylinder(GATE, y, 1.2, 1.2, 20.8, P, 18), { tone: "mid", inner: Ln([6, 12, 18].map((z) => k.sideArc(GATE, y, 1.2, z, P, 10)).join(""), { tone: "lo" }) }) +
        S(k.cylinder(GATE, y, 1.6, 22, 2, P, 18), { tone: "hi" }),
        shape: [{ t: "cyl", cx: GATE, cy: y, r: 1.8, z: 0, h: 24 }] });
    }
  }

  // ---------- VRAM dial: 0 to 16 GB over 270 degrees ----------
  const DIAL = [-24, 46];
  const DIAL_R = 9;
  const DIAL_TOP = 20;
  const SWEEP = (270 * Math.PI) / 180;
  const FROM = -SWEEP / 2;
  {
    const [x, y] = DIAL;
    const out = [S(k.cylinder(x, y, 6, 0, 1.6, P, 28), { tone: "lo" }), S(k.cylinder(x, y, 1.6, 1.6, 12.4, P, 16), { tone: "mid" })];
    out.push(S(k.cylinder(x, y, DIAL_R, 14, DIAL_TOP - 14, P, 56, 0.6), { tone: "hi", crease: "lo" }));
    out.push(Ln(k.knurl(x, y, DIAL_R, DIAL_TOP - 3, DIAL_TOP, 60, P, 0.3), { tone: "lo" }));
    out.push(Ln(k.ring(x, y, DIAL_R - 1.8, DIAL_TOP, P, 56), { tone: "lo" }));
    const ticks = k.radialTicks(x, y, DIAL_R - 2.2, 32, 2, DIAL_TOP, [0.9, 1.9], P, FROM, SWEEP);
    out.push(Ln(ticks.minor, { tone: "lo" }), Ln(ticks.major, { tone: "mid" }));
    const red = k.radialTicks(x, y, DIAL_R - 2.2, 1, 1, DIAL_TOP, [0.9, 3.2], P, FROM + SWEEP, 0.0001);
    out.push(Ln(red.major, { tone: "hi" }));
    out.push(Ln(k.ring(x, y, 1.3, DIAL_TOP, P, 14), { tone: "mid" }));
    add({ name: "dial", box: [[x - DIAL_R, y - DIAL_R, 0], [x + DIAL_R, y + DIAL_R, DIAL_TOP + 0.3]], svg: out.join(""),
      draw: (st) => {
        const a = FROM + (Math.min(M.GPU_GB, st.gauge) / M.GPU_GB) * SWEEP;
        const tip = [x + Math.sin(a) * (DIAL_R - 2.6), y - Math.cos(a) * (DIAL_R - 2.6)];
        const tail = [x - Math.sin(a) * 2.4, y + Math.cos(a) * 2.4];
        return `<path class="iso-line" data-tone="hi" data-free="start" style="stroke-width:1.1" d="${k.lineOnTop(tail, tip, DIAL_TOP + 0.2, P)}"/>`;
      },
      shape: [{ t: "cyl", cx: x, cy: y, r: DIAL_R, z: 14, h: DIAL_TOP - 14 }, { t: "cyl", cx: x, cy: y, r: 1.6, z: 0, h: 14 }] });
  }

  // ---------- ticket tray: requests waiting their turn, fanned so they can be counted (at most 8) ----------
  {
    const tray = { x: -50.2, y: 38, w: 16.6, d: 14, r: 1.2 };
    const out = [S(k.slabOf(tray, 0, 1.2, P, 3, 0.4), { tone: "lo" })];
    const rim = (plan) => S(k.slabOf(plan, 1.2, 1.6, P, 2), { tone: "mid" });
    out.push(rim({ x: tray.x, y: tray.y, w: tray.w, d: 1.2, r: 0.4 }), rim({ x: tray.x, y: tray.y + 1.2, w: 1.2, d: tray.d - 1.2, r: 0.4 }));
    add({ name: "tickets", box: [[tray.x, tray.y, 0], [tray.x + tray.w, tray.y + tray.d, 8.6]], svg: out.join(""), draw: (st) => {
      let html = "";
      for (let i = 0; i < st.waiting; i++) {
        const card = { x: tray.x + 2 + 0.7 * i, y: tray.y + 2.6 - 0.25 * i, w: 9, d: 8, r: 0.5 };
        const z = 1.2 + 0.8 * i;
        html += S(k.slabOf(card, z, 0.5, P, 2), { tone: "hi", crease: "none" });
        if (i === st.waiting - 1) {
          html += Ln(k.lineOnTop([card.x + 1.6, card.y + 2.4], [card.x + 7, card.y + 2.4], z + 0.5, P) + k.lineOnTop([card.x + 1.6, card.y + 4.2], [card.x + 6.2, card.y + 4.2], z + 0.5, P) + k.lineOnTop([card.x + 1.6, card.y + 6], [card.x + 6.4, card.y + 6], z + 0.5, P), { tone: "lo", free: true });
        }
      }
      return html;
    }, shape: [{ t: "slab", plan: tray, z: 0, h: 1.2 }] });
  }

  // ---------- crates: each model, drawn at its yard place and moved as one piece ----------
  const LABEL = { qwen3: "QWEN3 14B", gemma: "GEMMA 3 12B", coder: "QWEN3-CODER 30B", image: "QWEN-IMAGE 2.1", video: "WAN 2.2 5B" };
  for (const key of M.ORDER) {
    const c = crates[key];
    const z0 = TIER(c.row);
    const plan = { x: c.x0, y: ROW_Y[c.row] - 5, w: c.length, d: 10, r: 0.8 };
    const lug = Math.min(15, c.length / 2 - 4);
    c.home = [0, 0, 0];
    c.bay = [0, (BAY_Y[0] + BAY_Y[1]) / 2 - ROW_Y[c.row], FLOOR - z0];
    c.lugs = lug;
    c.base = { plan, z0 };
    const picture = (lit) => {
      const seams = Ln(k.sideSeam(plan, z0 + 3, P, 3), { tone: "faint" });
      const out = [S(k.slabOf(plan, z0, CRATE_H, P, 3, 0.5), { tone: "hi", crease: "lo", lit, inner: seams })];
      const y1 = plan.y + plan.d;
      // battens at both ends of the long face, edge to edge
      out.push(Ln(k.segment([c.x0 + 2.4, y1, z0], [c.x0 + 2.4, y1, z0 + CRATE_H], P) + k.segment([c.x1 - 2.4, y1, z0], [c.x1 - 2.4, y1, z0 + CRATE_H], P), { tone: "lo" }));
      // the RAM share of the coder is marked where the gate falls
      if (c.inRam > 0) out.push(Ln(k.segment([GATE, y1, z0], [GATE, y1, z0 + CRATE_H], P) + k.lineOnTop([GATE, plan.y], [GATE, y1], z0 + CRATE_H, P), { tone: "mid" }));
      out.push(k.faceTextSvg(k.sideMatrix([c.x0 + 4, y1], z0 + 6, P, "left"), LABEL[key], { size: 2.6, tone: lit ? "hi" : "mid" }));
      out.push(k.faceTextSvg(k.sideMatrix([c.x1, y1 - 0.9], z0 + 6, P, "right"), `${M.MODELS[key].gb.toFixed(1)} GB`, { size: 2, tone: "mid" }));
      // lifting lugs
      for (const dx of [-lug, lug]) {
        out.push(S(k.slabOf({ x: c.cx + dx - 1.2, y: ROW_Y[c.row] - 0.7, w: 2.4, d: 1.4, r: 0.3 }, z0 + CRATE_H, 1.2, P, 2), { tone: "mid" }));
        out.push(Dt([at([c.cx + dx, ROW_Y[c.row] + 0.7, z0 + CRATE_H + 0.6])], { size: 0.35, tone: "lo" }));
      }
      return out.join("");
    };
    c.pictures = [picture(false), picture(true)];
    add({ name: `crate.${key}`, kind: "crate", key, svg: c.pictures[0], move: true,
      boxAt: (st) => {
        const o = st.crates[key];
        return [[plan.x + o[0], plan.y + o[1], z0 + o[2]], [plan.x + plan.w + o[0], plan.y + plan.d + o[1], z0 + CRATE_H + 1.2 + o[2]]];
      },
      shapeAt: (st) => {
        const o = st.crates[key];
        return [{ t: "slab", plan: { ...plan, x: plan.x + o[0], y: plan.y + o[1] }, z: z0 + o[2], h: CRATE_H }];
      },
    });
  }

  // ---------- the gantry ----------
  // end frames: a truck on the rail, two legs, a tie and a head beam; built at bridge y = 0
  const LEG_Y = 10;
  for (const x of [RL, RR]) {
    const out = [];
    const sill = { x: x - 2.6, y: -13, w: 5.2, d: 26, r: 1 };
    out.push(S(k.slabOf(sill, 2.4, 5, P, 3, 0.4), { tone: "mid" }));
    for (const wy of [-9, 9]) out.push(S(G.disc(x + 2.6, x + 3.6, 2.4, G.frameOf([0, wy, 4.8], X, Y, Z), P, { steps: 18 }), { tone: "mid" }), Dt([at([x + 3.6, wy, 4.8])], { size: 0.4 }));
    const leg = (y) => ({ x: x - 2, y: y - 2, w: 4, d: 4, r: 0.6 });
    out.push(S(k.slabOf(leg(-LEG_Y), 5, GIRDER[0] - 9.6, P, 2, 0.4), { tone: "mid" }));
    out.push(S(k.slabOf({ x: x - 1.4, y: -LEG_Y + 2, w: 2.8, d: 2 * LEG_Y - 4, r: 0.4 }, 34, 3, P, 2, 0.3), { tone: "mid" }));
    out.push(S(k.slabOf(leg(LEG_Y), 5, GIRDER[0] - 9.6, P, 2, 0.4), { tone: "mid" }));
    const head = { x: x - 2.8, y: -13, w: 5.6, d: 26, r: 1 };
    out.push(S(k.slabOf(head, GIRDER[0] - 4.6, 4.6, P, 3, 0.5), { tone: "mid" }));
    out.push(Dt([-LEG_Y, LEG_Y].map((y) => at([x, y, GIRDER[0]])), { size: 0.45 }));
    add({ name: `frame${x}`, kind: "gantry", svg: out.join(""), move: true,
      boxAt: (st) => [[x - 2.8, st.bridge - 13, 2.4], [x + 3.6, st.bridge + 13, GIRDER[0]]],
      shapeAt: (st) => [{ t: "box", min: [x - 2.8, st.bridge - 13, 2.4], max: [x + 2.8, st.bridge + 13, GIRDER[0]] }] });
  }
  // two girders; the hoist rope drops between them
  for (const [name, y0] of [["girder.back", -8], ["girder.front", 5]]) {
    const plan = { x: RL - 2.8, y: y0, w: RR - RL + 5.6, d: 3, r: 0.6 };
    const svg = S(k.slabOf(plan, GIRDER[0], GIRDER[1] - GIRDER[0], P, 2, 0.4), { tone: "mid", inner: Ln(k.sideSeam(plan, GIRDER[0] + 1.6, P, 2), { tone: "faint" }) }) +
      Dt([RL + 12, (RL + RR) / 2, RR - 12].map((x) => at([x, y0 + 1.5, GIRDER[1]])), { size: 0.4 });
    add({ name, kind: "gantry", svg, move: true,
      boxAt: (st) => [[plan.x, st.bridge + y0, GIRDER[0]], [plan.x + plan.w, st.bridge + y0 + 3, GIRDER[1]]],
      shapeAt: (st) => [{ t: "box", min: [plan.x, st.bridge + y0, GIRDER[0]], max: [plan.x + plan.w, st.bridge + y0 + 3, GIRDER[1]] }] });
  }
  // trolley with its hoist drum and motor, built at x = 0, bridge y = 0
  {
    const body = { x: -8, y: -9.5, w: 16, d: 19, r: 1.2 };
    const out = [S(k.slabOf(body, GIRDER[1], 4, P, 3, 0.5), { tone: "mid" })];
    const drum = G.frameOf([0, 0, GIRDER[1] + 7.6], X, Y, Z);
    out.push(S(k.slabOf({ x: -7, y: -2.4, w: 2, d: 4.8, r: 0.4 }, GIRDER[1] + 4, 3.6, P, 2), { tone: "mid" }));
    out.push(S(G.disc(-5, 3, 3.4, drum, P, { steps: 28 }), { tone: "hi", crease: "lo" }));
    out.push(Ln(G.ribsOf(drum, -5, 3, 3.4, 22, P, { least: 0.15 }), { tone: "lo" }));
    out.push(S(k.slabOf({ x: 3, y: -2.4, w: 2, d: 4.8, r: 0.4 }, GIRDER[1] + 4, 3.6, P, 2), { tone: "mid" }));
    out.push(S(G.disc(5, 11, 2.6, drum, P, { steps: 24 }), { tone: "mid" }));
    out.push(Ln(G.ribsOf(drum, 5, 11, 2.6, 18, P, { least: 0.2 }), { tone: "faint" }));
    out.push(Dt([[-6, -7.6], [6, -7.6], [-6, 7.6], [6, 7.6]].map(([x, y]) => at([x, y, GIRDER[1] + 4])), { size: 0.45 }));
    add({ name: "trolley", kind: "gantry", svg: out.join(""), move: true,
      boxAt: (st) => [[st.trolley - 8, st.bridge - 9.5, GIRDER[1]], [st.trolley + 11, st.bridge + 9.5, GIRDER[1] + 11]],
      shapeAt: (st) => [{ t: "box", min: [st.trolley - 8, st.bridge - 9.5, GIRDER[1]], max: [st.trolley + 8, st.bridge + 9.5, GIRDER[1] + 4] }] });
  }
  // the hoist rope: a single line from the trolley to the hook block
  add({ name: "rope", kind: "gantry", move: true,
    boxAt: (st) => [[st.trolley - 0.4, st.bridge - 0.4, st.hook + HS + 7], [st.trolley + 0.4, st.bridge + 0.4, GIRDER[1]]],
    draw: (st) => Ln(k.segment([st.trolley - 0.5, st.bridge, st.hook + HS + 7], [st.trolley - 0.5, st.bridge, GIRDER[1]], P) + k.segment([st.trolley + 0.5, st.bridge, st.hook + HS + 7], [st.trolley + 0.5, st.bridge, GIRDER[1]], P), { tone: "hi" }) });
  // hook block, spreader beam and slings; `hook` is the bottom of a crate hanging from it
  add({ name: "hook", kind: "gantry", move: true,
    boxAt: (st) => [[st.trolley - 16, st.bridge - 2.6, st.hook + HL], [st.trolley + 16, st.bridge + 2.6, st.hook + HS + 7]],
    shapeAt: (st) => [{ t: "box", min: [st.trolley - 16, st.bridge - 1.2, st.hook + HS], max: [st.trolley + 16, st.bridge + 1.2, st.hook + HS + 2] }],
    draw: (st) => {
      const x = st.trolley;
      const y = st.bridge;
      const h = st.hook;
      const reach = st.carrying ? crates[st.carrying].lugs : 15;
      const out = [];
      for (const s of [-1, 1]) {
        const top = [x + s * 15, y, h + HS];
        const end = [x + s * reach, y, h + HL];
        out.push(k.segment(top, end, P));
      }
      let svg = Ln(out.join(""), { tone: "hi" });
      if (!st.carrying) svg += Dt([at([x - 15, y, h + HL]), at([x + 15, y, h + HL])], { size: 0.6, tone: "hi" });
      svg += S(k.slabOf({ x: x - 16, y: y - 1.2, w: 32, d: 2.4, r: 0.4 }, h + HS, 2, P, 2, 0.3), { tone: "mid" });
      const block = G.frameOf([x, y - 2.6, h + HS + 4.6], Y, Z, X);
      svg += S(k.slabOf({ x: x - 2.4, y: y - 1.6, w: 4.8, d: 3.2, r: 0.6 }, h + HS + 2, 2.6, P, 2), { tone: "mid" });
      svg += S(G.disc(0, 5.2, 2.2, block, P, { steps: 20 }), { tone: "hi", crease: "lo" });
      svg += Dt([at([x, y + 2.6, h + HS + 4.6])], { size: 0.45, tone: "mid" });
      return svg;
    } });

  // ---------- painter's order: boxes separated along an axis, nearer one later ----------
  const D = (p) => p[0] * P._v[0] + p[1] * P._v[1] + p[2] * P._v[2];
  P._v = G.viewOf(P);
  const screenBox = ([a, b]) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const x of [a[0], b[0]]) for (const y of [a[1], b[1]]) for (const z of [a[2], b[2]]) {
      const [sx, sy] = at([x, y, z]);
      if (sx < x0) x0 = sx; if (sx > x1) x1 = sx; if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
    }
    return [x0, y0, x1, y1];
  };
  const EPS = 0.02;
  const unruled = new Set();
  function orderOf(st) {
    const n = items.length;
    const boxes = items.map((item) => (item.boxAt ? item.boxAt(st) : item.box));
    const screens = boxes.map(screenBox);
    const depth = boxes.map(([a, b]) => D([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2]));
    const after = Array.from({ length: n }, () => []);
    const need = new Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const p = screens[i];
      const q = screens[j];
      if (!(p[0] < q[2] && q[0] < p[2] && p[1] < q[3] && q[1] < p[3])) continue;
      const a = boxes[i];
      const b = boxes[j];
      // every axis that separates the boxes gives a verdict; opposite verdicts mean the
      // two can only meet in their bounding boxes, not on screen, so they need no edge
      let ahead = 0, behind = 0;
      for (let ax = 0; ax < 3; ax++) {
        if (a[1][ax] <= b[0][ax] + EPS) ahead++;
        else if (b[1][ax] <= a[0][ax] + EPS) behind++;
      }
      if (ahead && behind) continue;
      let r = ahead ? 1 : behind ? -1 : 0;
      if (!r) {
        unruled.add(`${items[i].name} × ${items[j].name}`);
        r = depth[j] >= depth[i] ? 1 : -1;
      }
      const [back, front] = r > 0 ? [i, j] : [j, i];
      after[back].push(front);
      need[front]++;
    }
    const ready = [];
    for (let i = 0; i < n; i++) if (!need[i]) ready.push(i);
    const out = [];
    let forced = 0;
    while (out.length < n) {
      if (!ready.length) {
        forced++;
        let best = -1;
        for (let i = 0; i < n; i++) if (need[i] > 0 && (best < 0 || depth[i] < depth[best])) best = i;
        need[best] = 0;
        ready.push(best);
      }
      ready.sort((i, j) => depth[j] - depth[i]);
      const i = ready.pop();
      if (need[i] < 0) continue;
      need[i] = -1;
      out.push(i);
      for (const j of after[i]) if (need[j] > 0 && --need[j] === 0) ready.push(j);
    }
    return { order: out, forced };
  }

  // translate for a moving item in state st
  function offsetOf(item, st) {
    if (item.kind === "crate") return st.crates[item.key];
    if (item.name === "trolley") return [st.trolley, st.bridge, 0];
    if (item.kind === "gantry" && item.svg) return [0, st.bridge, 0];
    return null;
  }

  const restState = () => ({
    bridge: HOME, trolley: crates.qwen3.cx, hook: SAFE, carrying: null, gauge: M.RESERVE_GB, waiting: 0, lit: null,
    crates: Object.fromEntries(M.ORDER.map((key) => [key, [0, 0, 0]])),
  });

  return { items, crates, orderOf, offsetOf, restState, unruled, ROW_Y, TIER, BAY_Y, FLOOR, SAFE, GATE, U, HOME };
}

const P = {"origin":[271.87202943948984,252.15110450934634],"scale":1.6222272759297838,"azimuth":60,"elevation":35,"_v":[0.409576022144496,0.7094064799162224,0.573576436351046]};
const scene = makeScene(k, G, P, M);
const stage = document.querySelector(".gd-stage");
const core = stage.querySelector("[data-core]");
const readout = document.querySelector("[data-readout]");
const live = document.querySelector(".gd-live");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const nodes = [...core.children].sort((a, b) => a.dataset.i - b.dataset.i);
const dyn = nodes.map((g) => g.querySelector("[data-d]"));
const items = scene.items;
const st = scene.restState();
let shown = [0,2,1,37,19,20,16,5,17,36,13,14,35,10,11,21,43,18,34,7,8,33,32,3,12,9,15,28,22,23,24,27,4,38,39,42,40,41,25,26,31,30,29,6];
const drawn = new Array(items.length).fill(null);
const litShown = {};

// ---- the queue and the crane program ----
const waiting = [];
let program = [];      // segments still to play
let seg = null;        // { kind, ...; t, d }
let loaded = null;     // model seated in the bay
let running = null;    // the request being worked
let phase = "card empty";
let flash = 0, flashText = "";
let tourAt = 0, touring = !still.matches, tourIndex = 0, idleSince = 0, clock = 0;
const name = (key) => M.MODELS[key].name;
const SAY = { plan: (m) => name(m) + " plans the request", chat: (m) => name(m) + " answers", diagram: (m) => name(m) + " writes the scene", animation: (m) => name(m) + " writes the scene",
  vision: (m) => name(m) + " reads the image", coding: (m) => name(m) + " codes · " + M.split(m).inRam.toFixed(1) + " GB in RAM", image: (m) => name(m) + " paints", video: (m) => name(m) + " renders video" };

function enqueue(request) {
  if (waiting.length + (running ? 1 : 0) >= M.QUEUE_MAX) { flash = 2.2; flashText = "queue full: SimoAI refuses a 9th request"; run(); return false; }
  waiting.push(request);
  run();
  return true;
}
function startNext() {
  running = waiting.shift();
  const plan = M.stepsFor(running.tasks, loaded);
  live.textContent = "Request: " + running.label;
  for (const step of plan.steps) expand(step);
  program.push({ kind: "done" });
}
const move = (to, say) => program.push({ kind: "move", to, say });
function expand(step) {
  const c = scene.crates[step.model];
  const rowY = scene.ROW_Y[c.row];
  const bayY = (scene.BAY_Y[0] + scene.BAY_Y[1]) / 2;
  const tier = scene.TIER(c.row);
  if (step.do === "load") {
    const say = "loading " + name(step.model);
    move({ hook: scene.SAFE }, say);
    move({ bridge: rowY, trolley: c.cx }, say);
    move({ hook: tier }, say);
    program.push({ kind: "attach", model: step.model, say });
    move({ hook: scene.SAFE }, say);
    move({ bridge: bayY }, say);
    move({ hook: scene.FLOOR }, say);
    program.push({ kind: "seat", model: step.model, say });
    move({ hook: scene.SAFE }, say);
  } else if (step.do === "unload") {
    const say = step.why === "keep_alive 0" ? name(step.model) + " unloads · keep_alive 0" : "freeing " + name(step.model) + " for text work";
    move({ hook: scene.SAFE }, say);
    move({ bridge: bayY, trolley: c.cx }, say);
    move({ hook: scene.FLOOR }, say);
    program.push({ kind: "attach", model: step.model, say, unseat: true });
    move({ hook: scene.SAFE }, say);
    move({ bridge: rowY }, say);
    move({ hook: tier }, say);
    program.push({ kind: "detach", model: step.model, say });
    move({ hook: scene.SAFE }, say);
  } else {
    program.push({ kind: "work", model: step.model, d: step.seconds, say: SAY[step.tool](step.model) });
  }
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function begin(s) {
  if (s.kind === "move") {
    s.from = { bridge: st.bridge, trolley: st.trolley, hook: st.hook };
    const d = Math.max(Math.abs((s.to.bridge ?? st.bridge) - st.bridge) / 85, Math.abs((s.to.trolley ?? st.trolley) - st.trolley) / 85, Math.abs((s.to.hook ?? st.hook) - st.hook) / 65);
    s.d = still.matches ? 0 : d < 0.01 ? 0 : Math.max(0.35, d);
  } else if (s.kind !== "work") s.d = 0;
  s.t = 0;
  if (s.say) phase = s.say;
  if (s.kind === "attach") { st.carrying = s.model; st.lit = s.model; if (s.unseat) loaded = null; }
  if (s.kind === "seat") { st.carrying = null; loaded = s.model; }
  if (s.kind === "detach") { st.carrying = null; st.crates[s.model] = [0, 0, 0]; st.lit = null; }
  if (s.kind === "work") st.lit = s.model;
  if (s.kind === "done") {
    live.textContent = "Done: " + running.label;
    running = null;
    st.lit = null;
    idleSince = clock;
    if (!waiting.length) { move({ hook: scene.SAFE }); move({ bridge: scene.HOME }); }
  }
}
function follow() {
  // a crate on the hook rides with it
  if (st.carrying) {
    const c = scene.crates[st.carrying];
    st.crates[st.carrying] = [st.trolley - c.cx, st.bridge - scene.ROW_Y[c.row], st.hook - scene.TIER(c.row)];
  }
}
function step(dt) {
  let budget = dt;
  while (true) {
    if (!seg) {
      if (!program.length) {
        if (!running && waiting.length) startNext();
        else break;
      }
      seg = program.shift();
      begin(seg);
    }
    if (seg.kind === "move" && seg.d > 0) {
      seg.t = Math.min(seg.d, seg.t + budget);
      const f = ease(seg.t / seg.d);
      for (const key of ["bridge", "trolley", "hook"]) if (seg.to[key] !== undefined) st[key] = seg.from[key] + (seg.to[key] - seg.from[key]) * f;
      follow();
      if (seg.t < seg.d) return;
      budget = 0;
    } else if (seg.kind === "move") {
      Object.assign(st, seg.to);
      follow();
    } else if (seg.kind === "work") {
      seg.t += budget;
      if (seg.t < seg.d) return;
      budget = 0;
    }
    seg = null;
  }
}

// ---- drawing ----
function draw() {
  const target = M.usedGb(loaded);
  st.gauge = still.matches ? target : st.gauge + (target - st.gauge) * (1 - Math.exp(-lastDt / 0.35));
  st.waiting = waiting.length;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const off = scene.offsetOf(item, st);
    if (off) {
      const t = translateAlong(P, off);
      if (nodes[i].getAttribute("transform") !== t) nodes[i].setAttribute("transform", t);
    }
    if (item.kind === "crate") {
      const lit = st.lit === item.key;
      if (litShown[item.key] !== lit) { litShown[item.key] = lit; nodes[i].innerHTML = scene.crates[item.key].pictures[lit ? 1 : 0]; }
    }
    if (dyn[i]) {
      const html = item.draw(st);
      if (html !== drawn[i]) { drawn[i] = html; dyn[i].innerHTML = html; }
    }
  }
  const { order } = scene.orderOf(st);
  let same = true;
  for (let i = 0; same && i < order.length; i++) if (order[i] !== shown[i]) same = false;
  if (!same) { for (const i of order) core.appendChild(nodes[i]); shown = order; }
  const where = loaded ? (running ? "" : name(loaded) + " stays loaded") : running ? "" : "card empty";
  const text = (flash > 0 ? flashText : running ? phase : where) + " · " + st.gauge.toFixed(1) + " / 16 GB" + (waiting.length ? " · " + waiting.length + " waiting" : "");
  if (readout.textContent !== text) readout.textContent = text;
}

// ---- loop ----
let frame = 0, last = 0, lastDt = 1 / 60, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  lastDt = dt;
  clock += dt;
  if (flash > 0) flash -= dt;
  if (touring && !running && !waiting.length && !program.length && clock - idleSince > 1.4) {
    enqueue(M.TOUR[tourIndex++ % M.TOUR.length]);
  }
  step(dt);
  draw();
  const busy = running || waiting.length || seg || program.length || flash > 0 || touring || Math.abs(st.gauge - M.usedGb(loaded)) > 0.01;
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let idleTimer = 0;
const hold = () => { touring = false; clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !still.matches; run(); }, 6000); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const manual = (key) => ({ label: name(key) + " (picked by hand)", tasks: [M.MANUAL_TOOL[key]] });
stage.addEventListener("click", (e) => {
  const g = e.target.closest("[data-crate]");
  if (!g) return;
  hold();
  enqueue(manual(g.dataset.crate));
});
stage.addEventListener("keydown", (e) => {
  const n = Number(e.key);
  if (n >= 1 && n <= 5) { hold(); enqueue(manual(M.ORDER[n - 1])); e.preventDefault(); }
  else if (e.key === "a" || e.key === "A") { hold(); enqueue(M.TOUR[tourIndex++ % M.TOUR.length]); e.preventDefault(); }
});
if (still.matches) touring = false;
draw();
window.__dock = { state: () => ({ phase, loaded, running: running && running.label, waiting: waiting.length, st: JSON.parse(JSON.stringify(st)) }), queue: (key) => enqueue(key === "auto" ? M.TOUR[tourIndex++ % M.TOUR.length] : manual(key)), stopTour: () => { touring = false; clearTimeout(idleTimer); } };

// follow the host page's theme and tell it how tall the figure is
addEventListener("message", (e) => {
  if (e.source !== parent || !e.data || e.data.type !== "theme") return;
  document.body.dataset.theme = e.data.theme === "dark" ? "dark" : "light";
});
if (parent !== window) {
  const report = () => parent.postMessage({ type: "figure-height", height: Math.ceil(document.querySelector(".iso-figure").getBoundingClientRect().height) }, "*");
  new ResizeObserver(report).observe(document.querySelector(".iso-figure"));
  report();
}
